<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuorumESP portal</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a222c; --line:#2a3542; --txt:#dbe4ee;
    --dim:#8fa0b3; --acc:#4da3ff; --ok:#3fd68c; --warn:#ffb224;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,sans-serif;
    margin:0;padding:24px 16px 64px}
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  h1{font-size:22px;margin:0}
  #fw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--ok)}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .board{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;text-align:center;cursor:pointer;transition:border-color .15s}
  .board:hover{border-color:var(--acc)}
  .board.sel{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .board svg{width:100%;height:auto;display:block}
  .board h3{font-size:15px;margin:10px 0 2px}
  .board p{font-size:12.5px;color:var(--dim);margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin:14px 0}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
  select{background:#0d1319;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:14px;max-width:100%}
  button{background:var(--acc);color:#06121f;border:0;border-radius:8px;
    padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
  #msg{font-size:13px;color:var(--warn);min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QuorumESP</h1>
    <span id="fw">firmware —</span>
  </header>
  <p class="sub">Pick a board to connect over USB. No installs, no servers.</p>

  <div class="grid" id="boards"></div>

  <div class="card">
    <div class="row">
      <select id="rel"><option value="">(pick a board first)</option></select>
      <button id="bFlash" disabled>Flash</button>
    </div>
    <p class="sub">Release firmware to app slot (0x20000). Config on the board is never touched.</p>
    <p id="msg"></p>
  </div>
</div>

<script src="https://unpkg.com/esptool-js/bundle.js"></script>
<script src="./boards.js"></script>
<script src="./app.js"></script>
</body>
</html>
