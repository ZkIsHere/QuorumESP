# Release: build firmware ON THE SELF-HOSTED runner and publish a GitHub
# Release carrying firmware.bin + version.txt for on-device OTA.
#
# The runner has no IDF preinstalled: esp-idf v6.1 + tools are fetched once
# and cached (actions/cache). First run takes ~20-30 min, later runs ~5-8.
# Requirements on the runner (one-time, installed by this workflow via apt):
# git wget flex bison gperf python3-venv cmake ninja ccache dfu-util libusb.
#
# Triggers:
#   - tag push v*  -> build + publish release (device-installable)
#   - manual dispatch -> build only (validates the pipeline)
#
# Version scheme: release builds bake -DPROJECT_VER=<tag>; the device
# compares it with version.txt byte-for-byte. Local dev builds use the git
# hash instead, so a release always differs from (and supersedes) dev builds.
# The release repo must be PUBLIC (device downloads without a token).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  IDF_VERSION: v6.1
  IDF_PATH: ${{ github.workspace }}/esp-idf
  IDF_TOOLS_PATH: ${{ github.workspace }}/esp-tools
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  firmware:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git wget flex bison gperf \
            python3 python3-venv python3-pip cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 unzip

      - name: Restore ESP-IDF + tools cache
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            esp-idf
            esp-tools
          key: idf-v6.1-${{ runner.os }}-v1

      - name: Install ESP-IDF (cache miss only)
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          [ -d esp-idf ] || git clone --depth 1 --branch "$IDF_VERSION" \
            https://github.com/espressif/esp-idf.git esp-idf
          cd esp-idf
          ./install.sh esp32

      - name: Build firmware
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA::7}"; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          . ./esp-idf/export.sh
          cd firmware
          idf.py -DPROJECT_VER="$VER" -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build
        shell: bash

      - name: Package artifacts
        run: |
          cd firmware
          printf '%s' "$VER" > version.txt
          cp build/QuorumESP.bin firmware.bin
          ls -la firmware.bin version.txt
          sha256sum firmware.bin

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        run: |
          cd firmware
          gh release create "$VER" firmware.bin version.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VER (EXPERIMENTAL)" \
            --notes "Experimental QuorumESP dev preview over HTTPS. No production TLS provisioning yet - see docs. Vote logic: FFSplit. Do not deploy to production clusters."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
