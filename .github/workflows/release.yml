# Release: build firmware ON THE SELF-HOSTED runner and publish a GitHub
# Release carrying firmware.bin + version.txt for on-device OTA.
#
# PREREQUISITE (one-time, manual, on the runner itself — see docs/ota.md):
# ESP-IDF v6.1 + xtensa toolchain + python env live at ~/esp-idf and
# ~/esp-tools. CI never downloads toolchains (the runner link stalls on
# big files); it only verifies presence and fails loudly otherwise.
#
# Triggers:
#   - tag push v*  -> build + publish release (device-installable)
#   - manual dispatch -> build only (validates the pipeline)
#
# Version scheme: release builds bake -DPROJECT_VER=<tag>; the device
# compares it with version.txt byte-for-byte. Local dev builds use the git
# hash instead, so a release always differs from (and supersedes) dev builds.
# The release repo must be PUBLIC (device downloads without a token).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  IDF_VERSION: v6.1
  IDF_PATH: ~/esp-idf
  IDF_TOOLS_PATH: ~/esp-tools
  ESP_IDF_VERSION: 6.1.0
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  firmware:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git wget flex bison gperf \
            python3 python3-venv python3-pip cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 unzip

      - name: Verify ESP-IDF install
        run: |
          [ -f "$HOME/esp-idf/tools/idf_tools.py" ] || {
            echo "MISSING ~/esp-idf — one-time manual install required:"
            echo "  git clone --depth 1 --branch v6.1 https://github.com/espressif/esp-idf.git ~/esp-idf"
            echo "  cd ~/esp-idf && export IDF_TOOLS_PATH=~/esp-tools"
            echo "  python3 tools/idf_tools.py install xtensa-esp-elf"
            echo "  python3 tools/idf_tools.py install-python-env"
            exit 1
          }
          [ -x "$HOME/esp-tools/python_env"/idf*py*/bin/python ] || {
            echo "MISSING python venv under ~/esp-tools — rerun install-python-env"
            exit 1
          }
          GCC=$(find "$HOME/esp-tools/tools/xtensa-esp-elf" \
            -name xtensa-esp32-elf-gcc -print -quit)
          [ -n "$GCC" ] || {
            echo "MISSING toolchain under ~/esp-tools"
            exit 1
          }
          echo "IDF OK: $GCC"

      - name: Build firmware
        timeout-minutes: 45
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA::7}"; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          # Manual env: compiler + python venv on PATH (no export.sh — it
          # demands the full toolset incl. gdb, which we skip deliberately).
          VENV=$(echo "$HOME/esp-tools"/python_env/idf*py*/bin)
          GCCBIN=$(dirname $(find "$HOME/esp-tools/tools/xtensa-esp-elf" -name xtensa-esp32-elf-gcc -print -quit))
          export PATH="$VENV:$GCCBIN:$PATH"
          export IDF_PYTHON_ENV_PATH="$(dirname "$VENV")"
          xtensa-esp32-elf-gcc --version | head -1
          cd firmware
          idf.py -DPROJECT_VER="$VER" -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build
        shell: bash

      - name: Package artifacts
        run: |
          cd firmware
          printf '%s' "$VER" > version.txt
          cp build/QuorumESP.bin firmware.bin
          ls -la firmware.bin version.txt
          sha256sum firmware.bin

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        run: |
          cd firmware
          gh release create "$VER" firmware.bin version.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VER (EXPERIMENTAL)" \
            --notes "Experimental QuorumESP dev preview over HTTPS. No production TLS provisioning yet - see docs. Vote logic: FFSplit. Do not deploy to production clusters."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
