name: Runner Probe (temporary)
# One-off diagnostic for CI design. Delete after reading results.

on:
  push:
    paths:
      - .github/workflows/probe.yml

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Toolchain inventory
        run: |
          echo "=== node ==="; (node --version; npm --version) 2>&1 || true
          echo "=== python ==="; (python3 --version) 2>&1 || true
          echo "=== gh ==="; (gh --version 2>&1 | head -1) || true
          echo "=== idf ==="; (ls -d /opt/esp* /opt/idf* ~/esp /root/esp 2>&1; which idf.py 2>&1) || true
          echo "=== openssl ==="; (openssl version 2>&1) || true
          echo "=== apt ==="; (which apt-get cmake ninja gcc 2>&1) || true
